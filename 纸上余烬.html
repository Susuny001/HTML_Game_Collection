                        | |                                     \\                       /","                     _________                                       \\                     /","                     | |                                              \\                   /","              _________                                                \\                 /","              | |                                                       \\               /","       _________                                                         ==============/","       | |","_________","| |"]}],"lore":[{"title":"一枚句点","text":"城里每个人都以为自己是一行正文。直到铅雨落下，他们才发现脚下的街道，只是某人随手划去的草稿。"},{"title":"修补匠的便条","text":"双引号适合做窗，破折号适合做桥。倘若你的路走断了，别急着回头，试试把自己当作一个省略号。"},{"title":"关于留白","text":"林中的空白并非无物。在那些没有写字的地方，树根仍在生长。它们缓慢而坚持，谁也无法校对。"},{"title":"归还日期","text":"书库里的所有书都没有归还日期。管理员说：从港口出发的人，总要穿过森林，才能明白自己借走了什么。她正等你把最后一页归还。"},{"title":"机械祷词","text":"齿轮每转一圈，工人就忘记一个词。他们后来只剩下工作这个词，最后连工作也忘了。钟还在走。"},{"title":"退潮之后","text":"港口的潮水退去时，沙上留下许多没有寄出的信。你把它们收进背包，沿着旧城走向森林。信纸上的地址，都指向森林另一端的书库。"},{"title":"塔的高度","text":"森林里可以看见残塔。你不必登塔，穿过它倒塌的影子就能抵达书库。塔的每一块砖上，都刻着一段被擦去的昨日。"},{"title":"折页小巷的门","text":"小巷尽头曾有一扇门，门后不是房间，而是你第一次说不的那个下午。如今只剩门框。"},{"title":"一张旧车票","text":"车票上没有目的地。检票员打了一个孔，说这是给勇气透气的地方。请沿着铁轨走，别沿着字走。"},{"title":"无声月台","text":"月台每天都有列车抵达，却没有人上车。人们怕坐过自己的那一站，于是错过了每一站。"},{"title":"空屋里的人","text":"房屋没有窗户，却在每个清晨亮起来。也许住在里面的不是人，而是我们没有选择的人生。"},{"title":"抄写员","text":"抄写员一生只犯过一次错：把永远写成了永远吗。世界从那以后有了季节。"},{"title":"两片叶子","text":"第一片叶子问第二片叶子，落下去是什么感觉。第二片叶子说，我还不知道，但风似乎很温柔。"},{"title":"树洞里的信","text":"如果有人找到这封信，请不要替我完成它。我留下的空白，是我最后能够决定的东西。"},{"title":"森林的口令","text":"从港口来到森林不用口令，前往书库却需要。口令不是一个词，是你愿意相信，那些被擦去的人仍值得被记得。"},{"title":"盲鹿","text":"鹿没有眼睛，却能找到所有泉水。它告诉我，渴望有时比视线更清楚，只是别把恐惧错认成渴望。"},{"title":"年轮","text":"每一圈年轮都记着一次没有说出口的道别。老树因此比年轻的树更安静，也更愿意为人挡雨。"},{"title":"最后一位读者","text":"最后一位读者把书翻到末页，发现结局被擦掉了。他笑起来，说总算有一本书愿意相信自己。"},{"title":"索引零","text":"第零号索引记载着所有不存在的书。它比其他目录厚得多，因为人们没有写出的故事，总比写出的多。"},{"title":"书脊","text":"不要只看书脊上的名字。许多真正的英雄都住在脚注里，一生不曾被任何人高声读出。"},{"title":"校对者","text":"他逐字纠正世上的错误，直到某天发现，自己的名字也在需要删除的名单上。那天他放下了笔。"},{"title":"一把梯子","text":"梯子有十三个横档，其中一档断了。每次有人经过，都恰好缺少同一份勇气。请把它带回来。"},{"title":"未署名卷宗","text":"卷宗里写着你的旅程，但最后一页是空的。不要问是谁写的。先决定你愿不愿意继续。"},{"title":"钟摆","text":"钟摆向左时工厂记住过去，向右时工厂预演未来。只有经过中间的那一瞬间，机器才属于现在。"},{"title":"热铆钉","text":"老师傅总把第一颗铆钉留给徒弟。他说要记住烫手的感觉，否则有一天会把别人的痛当作温度。"},{"title":"停工通知","text":"通知上只有一个句号。所有人围着它看了一整夜，没有人敢相信，一件事情可以这样简单地结束。"},{"title":"报时鸟","text":"钟楼里从未住过鸟。每到整点飞出来的，是工人们从梦里剪下的翅膀。它们每次都飞不太远。"},{"title":"压力表","text":"压力表的最后一格不是数字，是一朵很小的花。设计它的人大概希望，爆炸之前仍有什么值得期待。"},{"title":"鲸的骨架","text":"鲸搁浅后，孩子们用它的肋骨搭了一座桥。大海没有收回它，因为它终于知道该怎样渡人。"},{"title":"没有锚的船","text":"船长扔掉了锚，大家责怪他不懂停留。后来风暴来了，他们才明白，有时候离开也是一种守护。"},{"title":"灯台守夜人","text":"灯台已经不再有船经过，守夜人却照常点灯。他说，灯不是只给看得见它的人点的。"},{"title":"潮汐账本","text":"账本记着海带走的一切，却没有一笔索赔。海的会计说，归还的事情，要交给时间来写。"},{"title":"一片白帆","text":"白帆从远方回来，上面一个字也没有。船员说，海上的故事太大，写在哪里都会显得拥挤。"},{"title":"未完石像","text":"石匠只完成了石像的双脚。后来他失踪了。路人说这是失败的作品，我却觉得它随时会迈步。"},{"title":"引力缝隙","text":"塔内的落物并不总是向下。忘记的事物会向上飘，记得太牢的东西，则会沉入地下。"},{"title":"第零层","text":"第零层不在地下，也不在天空。每当你愿意重新开始，它就会出现在脚下，而且只出现一次。"},{"title":"王冠","text":"王冠是用许多人的标点熔成的。戴上它的人，从此无法再说出一句没有命令意味的话。"},{"title":"尽头的标记","text":"港口、森林、书库，三章旅程在此连接成一句话。尽头站着最后的审阅者。只有击碎它的删改印，那个一直闪烁的光标，才会属于你。"},{"title":"关于重来","text":"重来不是回到原处。你带回的每一次迟疑、每一次出手，都在悄悄改变那个看似相同的清晨。"},{"title":"你留下的字","text":"如果这片世界终将被擦去，至少还有人在页边留下过一道奔跑的痕迹。那不是污点，是你来过。"},{"title":"休止符","text":"战斗间隙请允许自己停下。没有哪个故事需要每一拍都是重音，沉默也能让下一句话站得更稳。"},{"title":"另一条路","text":"每扇门后都不是唯一的路。你从未走过的那些房间，仍替你保存着一个尚未说出口的可能。"},{"title":"十字钟庭的相逢","text":"四条街在这里相遇，四座钟却报着不同的时间。卖花的姑娘说，这不是故障。每个人都有自己的准时，而相逢就是愿意为别人慢一点。"},{"title":"空心树宫","text":"树心很早就空了，树冠却一年比一年茂盛。路过的人总说它命不久矣，只有在树洞里避过雨的孩子知道，空出来的地方也可以庇护生命。"},{"title":"悬书","text":"书库里最轻的书从不落地。那上面写着最重的承诺。管理员把绳索解开，说有些承诺只有不再被攥在手里，才算真正兑现。"},{"title":"停下来的齿轮","text":"一只齿轮忽然停止转动，工厂因此安静了一秒。有人问它为什么。它说，刚才有一只蝴蝶要从两枚轮齿之间经过。"},{"title":"船底的姓名","text":"每艘远行船的船底都刻着建造者的名字。他们从不上船，也很少被人记得，但他们的名字，比所有人都先见到远处的海水。"},{"title":"观测日志","text":"今日，未发现新的星辰。但发现昨日那颗模糊的星依旧存在。记录员在末尾写：这已经足够让我再值一夜班。"},{"title":"第十三道桥","text":"镇上说第十三道桥通向不该去的地方。我们走过去，发现只是另一个镇子。那里也有人说，桥的另一头不该去。"},{"title":"替换件","text":"老师傅替一座老钟换过每一个零件。徒弟问，这还是原来的钟吗。他说，你已经忘记小时候的每一天，可你仍是那个孩子。"},{"title":"纸渠","text":"城里最后一条河是由撕下的日历折成的。人们把懊悔放在纸船上，看它顺流而去。河从不回头，也不问他们是否真的放下。"},{"title":"倒木王庭","text":"巨树倒下以后，蚂蚁在枝间建了新城。失去树荫的旅人觉得可惜，搬进裂缝的居民却开始了第一次春天。"},{"title":"无风的港口","text":"这里的帆永远垂着，船永远等着。一个孩子把风车挂上桅杆，笑着说，既然风还没来，我们就先替它转一会儿。"},{"title":"归零","text":"归零并非让一切没有发生。从旧港到森林，再到书库，你带来的痕迹已经成为新的一行。最后的巨像倒下后，空白不再是一种命令。"}]}</script><script id="decor" type="application/json">{"rows":["       ._____________________.","      /_______________________\\","     / /      _______  /       |","    / /      |_______|/        |","   | |            |   /","   | |        .---+--/.","   | |             .---.","   | |            /_____\\","   | |            | '|' |","   | |            |  *  |","   | |     ____   \\_____/","   | |    / . /\\          ____","   |   \\_____/  \\        /___/\\","   | |   | . |__/       |///|__|"," __|_|___|___|__________|___|_____","/________________________________\\"," |__|   / /   |__|   / /   |__|","     / /      _______  |       |","    / /      |_______| |       |","   | |            |    |","   | |        .---+---.|","   | |               .---.","   | |              /_____\\","   | |              | /|\\ |","   | |              |  *  |","   | |     ____     \\_____/","   |    \\____/  \\        /___/\\","     / /      _______  \\       |","    / /      |_______|  \\      |","   | |            |     \\","   | |        .---+---.  \\","   | |                 .---.","   | |                /_____\\","   | |                | .!. |","   | |                |  *  |","   | |     ____       \\_____/","   |     \\___/  \\        /___/\\","   | |              | \\|/ |","   |    /____/  \\        /___/\\","                       _________","           ___________/___/____/\\","          /__/__/__/__/___/____/ |","         /__X__X__X_..........| |","        /...........\\ /\\ /   | |","       /_/  V  V  V
