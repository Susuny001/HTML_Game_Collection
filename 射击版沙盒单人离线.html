<body>
  <!-- 3D 画布容器 -->
  <div id="game-container"></div>

  <!-- 水下蓝色滤镜（视角没入水中时淡入） -->
  <div id="water-overlay" aria-hidden="true"></div>

  <!-- 狙击镜视野：圆形透镜 + 十字分划线（开镜时淡入） -->
  <div id="scope-overlay" aria-hidden="true">
    <div class="scope-cross-h"></div>
    <div class="scope-cross-v"></div>
    <div class="scope-dot"></div>
  </div>

  <!-- 屏幕中央大字提示（解锁狙击枪等重要时刻），默认透明，仅用 .show 控制 -->
  <div id="center-banner" aria-hidden="true"></div>

  <!-- 季节切换黑屏过渡 -->
  <div id="fade-overlay" aria-hidden="true"></div>

  <!-- 游戏内 HUD：准星 / 左上角信息 / 底部快捷栏 -->
  <div id="hud" class="hidden">
    <div id="crosshair" aria-hidden="true"></div>
    <div id="info-panel"></div>
    <div id="hunt-panel" class="hidden"></div>
    <div id="hotbar"></div>
  </div>

  <!-- 开始菜单（背景为实时渲染的 3D 世界） -->
  <div id="start-menu" class="overlay">
    <div class="menu-card">
      <h1 class="menu-title">Voxel World</h1>
      <p class="menu-subtitle">3D 方块沙盒世界</p>
      <p id="menu-seed" class="menu-seed">Seed：—</p>
      <button id="btn-start" class="btn btn-primary">进入世界</button>
      <button id="btn-new-world" class="btn btn-ghost">随机新世界</button>
      <div class="controls-help">
        <span>WASD 移动</span>
        <span>Space 跳跃</span>
        <span>Shift 加速</span>
        <span>鼠标控制视角</span>
        <span>左键破坏</span>
        <span>右键放置</span>
        <span>1-9 / 滚轮切换方块</span>
        <span>水中按住 Space 上浮</span>
        <span>F 乘坐热气球</span>
        <span>G 掏枪打猎 · E 交付村民</span>
        <span>M 声音开关</span>
        <span>ESC 暂停</span>
      </div>
    </div>
  </div>

  <!-- 暂停菜单 -->
  <div id="pause-menu" class="overlay hidden">
    <div class="menu-card">
      <h2 class="menu-title small">游戏已暂停</h2>
      <button id="btn-resume" class="btn btn-primary">继续游戏</button>
      <button id="btn-restart" class="btn btn-ghost">重新开始</button>
      <button id="btn-sound" class="btn btn-ghost">声音：开</button>
    </div>
  </div>
