<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>霜熔深渊</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#08060f; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#eef3f8; user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .hud { position:fixed; top:14px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; font-weight:700; }
  .hud .col { display:flex; flex-direction:column; gap:6px; text-shadow:0 0 12px rgba(0,0,0,.8); }
  .badge { font-size:13px; letter-spacing:.08em; opacity:.85; }
  .big { font-size:26px; }
  .fire { color:#ff5a45; } .ice { color:#59c8ff; }
  .bar { width:170px; height:9px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar > i { display:block; height:100%; width:100%; transition:width .1s linear; }
  .hp i { background:linear-gradient(90deg,#ff3b3b,#ff9a4d); }
  .reso i { background:linear-gradient(90deg,#59c8ff,#b072ff,#ff5a45); }
  .combo { font-size:20px; color:#ffd86b; }
  .center { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
            background:radial-gradient(circle at 50% 40%, rgba(20,10,30,.55), rgba(8,6,15,.92)); z-index:20; pointer-events:auto; }
  .center.show { display:flex; }
  .title { font-size:40px; font-weight:900; letter-spacing:.04em; text-align:center;
           background:linear-gradient(90deg,#59c8ff,#fff,#ff5a45); -webkit-background-clip:text; background-clip:text; color:transparent;
           filter:drop-shadow(0 0 24px rgba(120,140,255,.35)); }
  .sub { opacity:.7; margin-top:10px; font-size:14px; }
  .cards { display:flex; gap:14px; margin-top:26px; flex-wrap:wrap; justify-content:center; max-width:92vw; }
  .card { width:200px; padding:20px 16px; border-radius:16px; cursor:pointer; text-align:center;
          background:rgba(20,16,40,.7); border:1px solid rgba(120,140,255,.28); transition:transform .12s, box-shadow .12s, border-color .12s; }
  .card:hover { transform:translateY(-6px) scale(1.03); border-color:#ff5a45; box-shadow:0 0 30px rgba(255,90,69,.35); }
  .card .ic { font-size:30px; margin-bottom:10px; }
  .card .nm { font-weight:800; font-size:16px; margin-bottom:6px; }
  .card .ds { font-size:12px; opacity:.72; line-height:1.5; }
  .btn { margin-top:26px; pointer-events:auto; cursor:pointer; padding:13px 30px; border:none; border-radius:999px;
         font-size:16px; font-weight:800; letter-spacing:.06em; color:#fff;
         background:linear-gradient(90deg,#3aa0ff,#7d5bff,#ff5a45); box-shadow:0 8px 30px rgba(120,90,255,.4); }
  .btn:active { transform:scale(.96); }
  .tip { position:fixed; bottom:14px; width:100%; text-align:center; font-size:12px; opacity:.45; }
  .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:15; }
  .rank { font-size:18px; margin-top:16px; letter-spacing:.05em; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud">
    <div class="col">
      <div class="badge">存活 <span class="big" id="time">0</span>s</div>
      <div class="bar hp"><i id="hp"></i></div>
      <div class="bar reso"><i id="reso"></i></div>
    </div>
    <div class="col" style="align-items:flex-end">
      <div class="badge">击杀 <span class="big fire" id="kills">0</span></div>
      <div class="badge combo" id="combo"></div>
      <div class="badge ice" id="lv">阶 · 1</div>
    </div>
  </div>
  <div class="tip">移动 WASD / 方向键 · 自动索敌 · 共鸣满自动释放霜熔冲击 · P 暂停</div>
  <div class="flash" id="flash"></div>
  <div class="center" id="over">
    <div class="title">霜 熔 熄 灭</div>
    <div class="sub" id="result"></div>
    <div class="rank" id="rank"></div>
    <button class="btn" id="again">再燃一局</button>
  </div>
  <div class="center" id="pick">
    <div class="title" style="font-size:30px">升华 · 择其一</div>
    <div class="cards" id="cards"></div>
  </div>
</div>
<script>
(function(){
  var cv = document.getElementById('game');
  var g = cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();

  function el(id){ return document.getElementById(id); }
  var rnd=Math.random, PI=Math.PI, TAU=PI*2;
  function rr(a,b){ return a+rnd()*(b-a); }

  var P, enemies, bullets, parts, rings;
  var keys={}, paused=false, dead=false, shake=0, tPrev=0;
  var upgradeLevel=0;
  var UPG=[
    {ic:'❄',nm:'冰锥齐鸣',ds:'连发弹体 +1',ap:function(){P.shots++;}},
    {ic:'✷',nm:'霜爆增幅',ds:'冰弹爆裂范围 +45%',ap:function(){P.iceRadius*=1.45;}},
    {ic:'✸',nm:'熔溢增幅',ds:'火弹灼烧范围 +45%',ap:function(){P.fireRadius*=1.45;}},
    {ic:'⟳',nm:'疾风之息',ds:'移动速度 +20%',ap:function(){P.speed*=1.2;}},
    {ic:'✹',nm:'急速脉冲',ds:'攻击间隔 -16%',ap:function(){P.cool*=0.84;}},
    {ic:'❤',nm:'熔核回响',ds:'共鸣获取 +40%',ap:function(){P.resoGain*=1.4;}},
    {ic:'☄',nm:'贯穿洪流',ds:'弹体伤害 +28%',ap:function(){P.dmg*=1.28;}},
    {ic:'✺',nm:'连锁引爆',ds:'击杀溅射伤害 +60%',ap:function(){P.chain*=1.6;}},
    {ic:'✦',nm:'霜甲',ds:'生命上限 +30% 并回复',ap:function(){P.maxHp*=1.3;P.hp=Math.min(P.maxHp,P.hp+P.maxHp*0.3);}},
    {ic:'✴',nm:'极寒共鸣',ds:'冲击波范围 +35%',ap:function(){P.shockR*=1.35;}}
  ];

  function reset(){
    P={x:W/2,y:H/2,r:26,speed:320,hp:100,maxHp:100,shots:1,cool:0,coolBase:0.32,fireCd:0,fireRadius:60,iceRadius:52,
       dmg:20,resoGain:1,reso:0,resoMax:100,shockR:280,combo:0,comboT:0,chain:70,ang:0,inv:0};
    enemies=[]; bullets=[]; parts=[]; rings=[];
    spawnT=0; wave=0; elapsed=0; kills=0; dead=false; paused=false; shake=0; upgradeLevel=0;
    el('over').className='center'; el('pick').className='center';
  }

  var spawnT=0, wave=0, elapsed=0, kills=0;

  function spawnEnemy(){
    var edge=(rnd()*4)|0, x,y;
    if(edge===0){x=rr(-30,W+30);y=-30;} else if(edge===1){x=W+30;y=rr(-30,H+30);}
    else if(edge===2){x=rr(-30,W+30);y=H+30;} else {x=-30;y=rr(-30,H+30);}
    var t=rnd(), kind='fire';
    var elite= elapsed>40 && t>0.93;
    if(elite)kind='void';
    else if(t>0.55)kind='ice';
    var e={x:x,y:y,vx:0,vy:0,kind:kind,r:18,hp:30,slow:0,burn:0,phase:rr(0,TAU),spin:rr(-1,1)};
    if(kind==='fire'){e.hp=30+elapsed*0.9;e.r=16;e.sp=70+elapsed*0.7;}
    if(kind==='ice'){e.hp=70+elapsed*1.4;e.r=24;e.sp=42+elapsed*0.4;}
    if(kind==='void'){e.hp=180+elapsed*2.2;e.r=38;e.sp=34+elapsed*0.3;}
    enemies.push(e);
  }

  function addGas(x,y,r,hue,count){
    for(var i=0;i<count;i++){
      parts.push({x:x,y:y,vx:rr(-40,40),vy:rr(-40,40),r:rr(6,18),hue:hue,life:1,decay:rr(1.4,2.6),a:rr(0,TAU),sw:rr(2,7)});
    }
  }

  function shock(){
    var cx=P.x,cy=P.y,R=P.shockR;
    rings.push({x:cx,y:cy,r:10,R:R,hue:200,life:1});
    rings.push({x:cx,y:cy,r:10,R:R*0.82,hue:4,life:1});
    shake=Math.min(30,shake+22); flash();
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i], dx=e.x-cx,dy=e.y-cy, d=Math.hypot(dx,dy);
      if(d<R){ killEnemy(i, true); }
    }
    P.reso=0;
  }

  function flash(){ var f=el('flash'); f.style.transition='none'; f.style.opacity='0.55'; requestAnimationFrame(function(){ f.style.transition='opacity .35s'; f.style.opacity='0'; }); }

  function killEnemy(i, shock){
    var e=enemies[i];
    var hue = e.kind==='ice'?202: e.kind==='fire'?4: 280;
    addGas(e.x,e.y,e.r,hue,e.kind==='void'?16:6);
    // 连锁溅射
    if(!shock){
      for(var j=enemies.length-1;j>=0;j--){
        if(j===i)continue;
        var o=enemies[j], dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy);
        if(d<e.r+40){ o.hp-=P.chain; if(o.hp<=0){ enemies.splice(i,1); i=Math.min(i,enemies.length); killEnemy(j,false); continue; } }
      }
    }
    enemies.splice(i,1);
    kills++;
    P.combo++; P.comboT=2.2;
    P.reso=Math.min(P.resoMax,P.reso+ (shock?0:(e.kind==='void'?18:e.kind==='ice'?5:3)) * P.resoGain);
    if(e.kind==='void'){ for(var k=0;k<3;k++){ var c={x:e.x+rr(-12,12),y:e.y+rr(-12,12),vx:0,vy:0,kind:'fire',r:13,hp:30+elapsed,slow:0,burn:0,phase:rr(0,TAU),spin:rr(-1,1),sp:90}; enemies.push(c);} }
    if(P.reso>=P.resoMax){ shock&&0; shock2(); }
  }
  function shock2(){ shock(); }

  function hurt(d){ if(P.inv>0)return; P.hp-=d; P.inv=0.5; shake=Math.min(26,shake+10); if(P.hp<=0){ P.hp=0; die(); } }

  function die(){ if(dead)return; dead=true; addGas(P.x,P.y,60,200,30); addGas(P.x,P.y,60,4,30); shake=40;
    setTimeout(function(){
      var t=Math.floor(elapsed);
      el('result').textContent='存活 '+t+' 秒 · 击杀 '+kills+' 团';
      el('rank').textContent='阶位评定：'+rank(t,kills);
      el('over').className='center show';
    },700);
  }
  function rank(t,k){ var s=k*1.2+t*3; if(s>4000)return '霜熔之主'; if(s>2200)return '冰火君主'; if(s>1200)return '深渊行者'; if(s>600)return '熔霜猎手'; return '余烬求生者'; }

  function offerUpgrades(){
    var pool=UPG.slice(), pick=[];
    for(var i=0;i<3 && pool.length;i++){ pick.push(pool.splice((rnd()*pool.length)|0,1)[0]); }
    var box=el('cards'); box.innerHTML='';
    pick.forEach(function(u){
      var d=document.createElement('div'); d.className='card';
      d.innerHTML='<div class="ic">'+u.ic+'</div><div class="nm">'+u.nm+'</div><div class="ds">'+u.ds+'</div>';
      d.onclick=function(){ u.ap(); upgradeLevel++; el('lv').textContent='阶 · '+(upgradeLevel+1); el('pick').className='center'; paused=false; };
      box.appendChild(d);
    });
    el('pick').className='center show'; paused=true;
  }

  var nextUpgrade=12;
  function fireBullets(){
    // 自动索敌最近若干敌人发射
    if(enemies.length===0) return;
    var n=P.shots;
    for(var s=0;s<n;s++){
      var target=null,best=1e9;
      for(var i=0;i<enemies.length;i++){ var e=enemies[i],dx=e.x-P.x,dy=e.y-P.y,d=dx*dx+dy*dy; if(d<best){best=d;target=e;} }
      if(!target)break;
      var ang=Math.atan2(target.y-P.y,target.x-P.x)+rr(-0.1,0.1);
      var kind = (P.fireCd<=0 && s%2===1)?'fire':'ice';
      if(kind==='fire') P.fireCd=1;
      bullets.push({x:P.x,y:P.y,vx:Math.cos(ang)*560,vy:Math.sin(ang)*560,r:7,kind:kind,life:1.6,pierce:1});
    }
  }

  function gas(x,y,r,hue,seed){
    var a=0.5;
    for(var i=0;i<5;i++){
      var px=x+Math.cos(seed+i*1.3+elapsed*2)*r*0.32;
      var py=y+Math.sin(seed+i*1.7+elapsed*2.3)*r*0.32;
      var rad=r*(0.7+0.3*Math.sin(seed+i+elapsed*3));
      var grd=g.createRadialGradient(px,py,0,px,py,rad);
      grd.addColorStop(0,'hsla('+hue+',100%,70%,'+a+')');
      grd.addColorStop(0.5,'hsla('+hue+',100%,55%,'+(a*0.45)+')');
      grd.addColorStop(1,'hsla('+hue+',100%,50%,0)');
      g.fillStyle=grd; g.beginPath(); g.arc(px,py,rad,0,TAU); g.fill();
    }
  }

  function loop(now){
    requestAnimationFrame(loop);
    var dt=Math.min(0.033,(now-tPrev)/1000||0); tPrev=now;
    // 背景
    g.globalCompositeOperation='source-over';
    g.fillStyle='rgba(8,6,15,0.32)'; g.fillRect(0,0,W,H);
    var sx=0,sy=0; if(shake>0){ sx=rr(-shake,shake); sy=rr(-shake,shake); shake*=0.86; }
    g.save(); g.translate(sx,sy);
    if(!paused && !dead){ elapsed+=dt; update(dt); }
    draw();
    g.restore();
    hud();
  }

  function update(dt){
    // 移动
    var dx=0,dy=0;
    if(keys['a']||keys['arrowleft'])dx--; if(keys['d']||keys['arrowright'])dx++;
    if(keys['w']||keys['arrowup'])dy--; if(keys['s']||keys['arrowdown'])dy++;
    if(dx||dy){ var m=Math.hypot(dx,dy); P.x+=dx/m*P.speed*dt; P.y+=dy/m*P.speed*dt; }
    P.x=Math.max(20,Math.min(W-20,P.x)); P.y=Math.max(20,Math.min(H-20,P.y));
    P.ang+=dt*2.2; if(P.inv>0)P.inv-=dt; if(P.fireCd>0)P.fireCd-=dt;
    if(P.comboT>0){ P.comboT-=dt; if(P.comboT<=0)P.combo=0; }
    // 生成
    var rate=Math.max(0.12, 1.05 - elapsed*0.018);
    spawnT-=dt;
    var cap=Math.min(420, 30+elapsed*2.4);
    if(spawnT<=0 && enemies.length<cap){ var burst=1+(elapsed>25?1:0)+(elapsed>60?1:0); for(var b=0;b<burst;b++)spawnEnemy(); spawnT=rate; }
    // 升级
    if(elapsed>=nextUpgrade){ nextUpgrade+=Math.max(14,26-upgradeLevel*1.2); offerUpgrades(); }
    // 攻击
    P.cool-=dt; if(P.cool<=0){ fireBullets(); P.cool=P.coolBase*(P.combo>0?Math.max(0.45,1-P.combo*0.012):1); }
    // 共鸣自动释放
    if(P.reso>=P.resoMax) shock();
    // 子弹
    for(var i=bullets.length-1;i>=0;i--){ var bl=bullets[i]; bl.x+=bl.vx*dt; bl.y+=bl.vy*dt; bl.life-=dt;
      if(bl.life<=0||bl.x<-40||bl.x>W+40||bl.y<-40||bl.y>H+40){ bullets.splice(i,1); continue; }
      for(var j=enemies.length-1;j>=0;j--){ var e=enemies[j],dx2=e.x-bl.x,dy2=e.y-bl.y,d2=Math.hypot(dx2,dy2);
        if(d2<e.r+bl.r){
          var dmg=P.dmg*(bl.kind==='fire'?1.25:0.9);
          e.hp-=dmg;
          if(bl.kind==='ice') e.slow=1.4; else e.burn=1.6;
          var R=bl.kind==='ice'?P.iceRadius:P.fireRadius;
          rings.push({x:bl.x,y:bl.y,r:4,R:R*0.6,hue:bl.kind==='ice'?202:4,life:1});
          // 冰火相遇 → 霜熔反应额外爆
          if(e.slow>0 && e.burn>0){ e.hp-=P.dmg*1.5; addGas(e.x,e.y,e.r,280,4); rings.push({x:e.x,y:e.y,r:6,R:90,hue:280,life:1}); shake=Math.min(18,shake+4); }
          for(var k=enemies.length-1;k>=0;k--){ var o=enemies[k],dx3=o.x-bl.x,dy3=o.y-bl.y,d3=Math.hypot(dx3,dy3); if(d3<R && k!==j){ o.hp-=dmg*0.5; } }
          bl.pierce--; if(bl.pierce<=0){ bullets.splice(i,1); }
          if(e.hp<=0){ killEnemy(j,false); }
          break;
        }
      }
    }
    // 敌人
    for(var m2=enemies.length-1;m2>=0;m2--){ var en=enemies[m2];
      var ex=P.x-en.x,ey=P.y-en.y,ed=Math.hypot(ex,ey)||1;
      var sp=en.sp*(en.slow>0?0.45:1);
      if(en.slow>0)en.slow-=dt; if(en.burn>0){ en.burn-=dt; en.hp-=18*dt; if(en.hp<=0){ killEnemy(m2,false); continue; } }
      en.x+=ex/ed*sp*dt; en.y+=ey/ed*sp*dt; en.phase+=en.spin*dt;
      if(ed<en.r+P.r*0.6){ hurt(en.kind==='void'?22:en.kind==='ice'?14:9); en.hp-=40; addGas(en.x,en.y,en.r,0,4); if(en.hp<=0)killEnemy(m2,false); }
    }
    // 粒子
    for(var p=parts.length-1;p>=0;p--){ var pt=parts[p]; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.94; pt.vy*=0.94; pt.a+=dt*3; pt.life-=pt.decay*dt; if(pt.life<=0)parts.splice(p,1); }
    if(parts.length>900)parts.splice(0,parts.length-900);
    for(var r2=rings.length-1;r2>=0;r2--){ var rg=rings[r2]; rg.r+=(rg.R-rg.r)*Math.min(1,dt*8)+dt*120; rg.life-=dt*1.6; if(rg.life<=0)rings.splice(r2,1); }
  }

  function draw(){
    var density=Math.min(1,enemies.length/260);
    // 星云辉光背景随敌人密度脉动
    g.globalCompositeOperation='lighter';
    var bg=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)/1.2);
    bg.addColorStop(0,'hsla(250,60%,'+(8+density*8)+'%,0.5)'); bg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    // 环
    for(var i=0;i<rings.length;i++){ var rg=rings[i];
      var gr=g.createRadialGradient(rg.x,rg.y,rg.r*0.5,rg.x,rg.y,rg.r);
      gr.addColorStop(0,'hsla('+rg.hue+',100%,65%,0)'); gr.addColorStop(0.7,'hsla('+rg.hue+',100%,65%,'+(rg.life*0.5)+')'); gr.addColorStop(1,'hsla('+rg.hue+',100%,65%,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(rg.x,rg.y,rg.r,0,TAU); g.fill(); }
    // 敌人气团
    for(var e2=0;e2<enemies.length;e2++){ var e=enemies[e2];
      var hue=e.kind==='ice'?202:e.kind==='fire'?4:285;
      gas(e.x,e.y,e.r,hue,e.phase);
    }
    // 子弹
    for(var b=0;b<bullets.length;b++){ var bl=bullets[b];
      g.fillStyle=bl.kind==='ice'?'rgba(120,210,255,0.95)':'rgba(255,150,90,0.95)';
      g.beginPath(); g.arc(bl.x,bl.y,bl.r,0,TAU); g.fill();
    }
    // 玩家 冰火双生气团
    if(!dead){
      var px=P.x,py=P.y,pr=P.r;
      g.save(); g.translate(px,py); g.rotate(P.ang);
      gas(-pr*0.45,0,pr*0.95,202,P.ang);
      gas(pr*0.45,0,pr*0.95,4,-P.ang);
      g.restore();
      var core=g.createRadialGradient(px,py,0,px,py,pr*0.7);
      core.addColorStop(0,'rgba(255,255,255,0.95)'); core.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=core; g.beginPath(); g.arc(px,py,pr*0.7,0,TAU); g.fill();
      if(P.inv>0){ g.globalCompositeOperation='source-over'; g.strokeStyle='rgba(255,255,255,'+(P.inv*1.6)+')'; g.lineWidth=2; g.beginPath(); g.arc(px,py,pr+6,0,TAU); g.stroke(); }
    }
    // 粒子（气雾）
    for(var p=0;p<parts.length;p++){ var pt=parts[p];
      var a=pt.life; var gr=g.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r);
      gr.addColorStop(0,'hsla('+pt.hue+',100%,70%,'+(a*0.6)+')'); gr.addColorStop(1,'hsla('+pt.hue+',100%,60%,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(pt.x,pt.y,pt.r,0,TAU); g.fill(); }
    g.globalCompositeOperation='source-over';
  }

  function hud(){
    el('time').textContent=Math.floor(elapsed);
    el('kills').textContent=kills;
    el('hp').style.width=(P.hp/P.maxHp*100)+'%';
    el('reso').style.width=(P.reso/P.resoMax*100)+'%';
    el('combo').textContent=P.combo>2?('连击 ×'+P.combo):'';
  }

  window.addEventListener('keydown',function(e){ var k=e.key.toLowerCase(); keys[k]=1;
    if(k==='p'){ if(!dead&&!el('pick').classList.contains('show'))paused=!paused; }
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0)e.preventDefault();
  });
  window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=0; });
  // 指针移动（桌面按住 / 触摸拖拽）
  var ptr=null;
  cv.addEventListener('pointerdown',function(e){ ptr={x:e.clientX,y:e.clientY}; });
  cv.addEventListener('pointermove',function(e){ if(ptr){ P.x=e.clientX; P.y=e.clientY; } });
  window.addEventListener('pointerup',function(){ ptr=null; });
  cv.addEventListener('touchmove',function(e){ if(P){ var t=e.touches[0]; P.x=t.clientX; P.y=t.clientY; } e.preventDefault(); },{passive:false});

  el('again').onclick=function(){ reset(); };

  reset();
  requestAnimationFrame(loop);
  // 通知外层游戏已就绪（可用于解锁/埋点），不影响玩法
  if(window.parent && window.parent!==window){ try{ window.parent.postMessage({t:'game-ready'},'*'); }catch(_){ } }
})();
</script>
</body>
</html>
